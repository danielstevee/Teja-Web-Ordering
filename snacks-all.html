<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanDine — Semua Camilan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style/styling.css">

  <style>
    body {
      padding-bottom: 32px;
    }

    .all-snacks-page {
      max-width: 448px;
      margin: 0 auto;
      padding: 0 var(--spacing-margin-mobile, 16px);
    }

    /* ── Search bar ── */
    .search-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--color-surface-container-low);
      border: 1.5px solid var(--color-outline-variant);
      border-radius: var(--radius-full);
      padding: 10px 16px;
      margin: 16px 0 20px;
      margin-top: 90px;
      
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-wrapper.is-focused {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(27,58,45,0.10);
    }
    .search-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: var(--font-base);
      font-size: 14px;
      color: var(--color-on-surface);
      outline: none;
    }
    .search-wrapper input::placeholder {
      color: var(--color-on-surface-muted);
    }
    .search-icon .material-symbols-outlined {
      font-size: 20px;
      color: var(--color-on-surface-muted);
    }

    /* ── Category chips ── */
    .chips-row-page {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 20px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .chips-row-page::-webkit-scrollbar { display: none; }

    /* ── Result meta ── */
    .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .result-count {
      font-size: 13px;
      color: var(--color-on-surface-muted);
      font-weight: 500;
    }
    .sort-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-primary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: var(--font-base);
    }

    /* ── Snacks grid (2 kolom) ── */
    .snacks-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── Snack card ── */
    .sg-card {
      background-color: var(--color-surface);
      border: 1.5px solid var(--color-outline-variant);
      border-radius: var(--radius-xl, 16px);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
    }
    .sg-card:active {
      transform: scale(0.97);
    }

    .sg-card__img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: var(--color-surface-container-low);
    }
    .sg-card__img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .sg-card:hover .sg-card__img-wrap img {
      transform: scale(1.04);
    }

    .sg-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-full);
    }
    .sg-badge--popular {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
    }
    .sg-badge--new {
      background-color: #E8F5E9;
      color: #1B5E20;
    }
    .sg-badge--promo {
      background-color: #FFF3E0;
      color: #E65100;
    }

    .sg-card__body {
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 2px;
    }
    .sg-card__name {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-on-surface);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }
    .sg-card__desc {
      font-size: 11px;
      color: var(--color-on-surface-muted);
      line-height: 1.4;
      margin-top: 2px;
      flex: 1;
    }
    .sg-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .sg-card__price {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.01em;
    }

    .sg-card__add {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-full);
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .sg-card__add:hover {
      background-color: var(--color-primary-light);
    }
    .sg-card__add:active {
      transform: scale(0.88);
    }
    .sg-card__add .material-symbols-outlined {
      font-size: 18px;
    }
    .sg-card__add.btn-success {
      background-color: #2e7d32;
    }

    /* ── Empty state ── */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      gap: 12px;
    }
    .empty-state .material-symbols-outlined {
      font-size: 48px;
      color: var(--color-on-surface-muted);
    }
    .empty-state p {
      font-size: 14px;
      color: var(--color-on-surface-muted);
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header id="site-header">
    <div class="header-inner">
      <button class="btn-profile" onclick="history.back()" aria-label="Kembali">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
 <div class="header-brand" style="position:absolute; left:50%; transform:translateX(-50%);">
  <h1 style="font-family: var(--font-base); font-size: 17px; font-weight: 700; color: var(--color-on-surface); letter-spacing: -0.005em; margin:0;">
    Semua Cemilan
  </h1>
</div>


    </div>
  </header>

  <!-- MAIN -->
  <main class="all-snacks-page" style="margin-top: 64px;">

    <!-- Search -->
    <div class="search-wrapper" id="search-wrapper">
      <div class="search-icon">
        <span class="material-symbols-outlined">search</span>
      </div>
      <input
        type="text"
        id="search-input"
        placeholder="Cari camilan favoritmu..."
        aria-label="Cari camilan"
      >
    </div>

    <!-- Chips -->
    <div class="chips-row-page" role="list" id="chip-row">
      <button class="chip chip--active"  role="listitem" data-filter="semua">Semua</button>
      <button class="chip chip--default" role="listitem" data-filter="goreng">Goreng</button>
      <button class="chip chip--default" role="listitem" data-filter="panggang">Panggang</button>
      <button class="chip chip--default" role="listitem" data-filter="promo">Promo</button>
      <button class="chip chip--default" role="listitem" data-filter="baru">Baru</button>
    </div>

    <!-- Result meta -->
    <div class="result-meta">
      <span class="result-count" id="result-count">8 camilan</span>
      <button class="sort-btn" id="sort-btn">
        <span class="material-symbols-outlined" style="font-size:16px;">swap_vert</span>
        Urutkan
      </button>
    </div>

    <!-- Grid -->
    <div class="snacks-grid" id="snacks-grid"></div>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state">
      <span class="material-symbols-outlined">search_off</span>
      <p>Camilan tidak ditemukan.<br>Coba kata kunci lain.</p>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav" aria-label="Navigasi utama">
    <button class="nav-item nav-item--active" aria-current="page">
      <span class="material-symbols-outlined">restaurant_menu</span>
      <span class="nav-label">Menu</span>
    </button>
    <button class="nav-item nav-item--inactive">
      <span class="material-symbols-outlined">receipt_long</span>
      <span class="nav-label">Orders</span>
    </button>
    <button class="nav-item nav-item--inactive">
      <span class="material-symbols-outlined">shopping_cart</span>
      <span class="nav-label">Cart</span>
    </button>
  </nav>

  <script>
    const snacks = [
      {

        desc:  'Kentang goreng renyah dengan aroma truffle mewah.',
        img:   'https://lh3.googleusercontent.com/aida-public/AB6AXuDN8XPN0gGtt029uyFNZQpBtgXei-ZyDeCb6Hp_WV_38hmr-CoiZPlJoOM-CBaSm2AvqxwjVXuXygKqTCMsYC-yNZw69C8dgsCxbWgO6VOqtJWbYLgi378LeJ2Ry0-fQVei3-O_8gUB0NINEl9PESmOKf-XBntuXZW0_DU5FMfjpqjfRFpSMWatiDiMgvbUBfdcAuUboYKUwGdkrprhQEE7jGo4vEA9JbRvU0Re1rDlWoDWbMQKGMgMatwVBGKu_xpK4JfX0Yv-Vlk',
        badge: 'popular',
        tags:  ['semua','goreng'],
      },
      {
        nama:  'Garlic Bread',
        harga: 28000,
        desc:  'Roti panggang mentega bawang putih dengan keju mozzarella.',
        img:   'https://lh3.googleusercontent.com/aida-public/AB6AXuD97FzkmaA4pK_vi2jNWr0OoSW_XCHj5vWC_Oyc_HpoJraDGJzoY9F-4E5dtmLh1MQC5vbtqf635ga9jnrhDl6NsF0bB6fgr02cWamVGlJislHEIXZ18qG3J-xGpv3KjgCFh6Ge1xYK-PK5_euZZc4xhmLMRytZ_U_b9NFCoCXxSQ9CjUDn0Ucfxncd-JHnRPg6T9f19Z78jUEJralh_0oVqbizcDrIrsZIUOZ_F72a3FFZ7GUaiiFCvk1tSPoX1TFacvp_OBiGWDA',
        badge: null,
        tags:  ['semua','panggang'],
      },
      {
        nama:  'Spicy Wings',
        harga: 42000,
        desc:  'Sayap ayam goreng dengan saus pedas khas UrbanDine.',
        img:   'https://lh3.googleusercontent.com/aida-public/AB6AXuDzZ43zd4lreg9T3vmd01wD4wHiwa4R0seqqk8Bcv26s9MNGiP_LF6M6EsGgk0QlXfkAMN1g5EhlcTV75PgKlAd4Ot9AYalyneqmA82MgkYyJfNFIG-mjdIC6yFaem6bR_uJLsvXAL6dIfd0vMovWCkc4UeAUr4Xs2sPyct-ZUk55QwMaiAWpa3OW41dm3et049KYMbxvV67Oiz3N-GwcVj-gfkBAymvBuHe5RBE0rernsrZb5-S4vt0YCRHiqsgiAiYomsccrspgA',
        badge: 'popular',
        tags:  ['semua','goreng'],
      },
      {
        nama:  'Cheese Sticks',
        harga: 30000,
        desc:  'Keju mozzarella dibalut tepung renyah, disajikan dengan saus marinara.',
        img:   'https://lh3.googleusercontent.com/aida-public/AB6AXuDN8XPN0gGtt029uyFNZQpBtgXei-ZyDeCb6Hp_WV_38hmr-CoiZPlJoOM-CBaSm2AvqxwjVXuXygKqTCMsYC-yNZw69C8dgsCxbWgO6VOqtJWbYLgi378LeJ2Ry0-fQVei3-O_8gUB0NINEl9PESmOKf-XBntuXZW0_DU5FMfjpqjfRFpSMWatiDiMgvbUBfdcAuUboYKUwGdkrprhQEE7jGo4vEA9JbRvU0Re1rDlWoDWbMQKGMgMatwVBGKu_xpK4JfX0Yv-Vlk',
        badge: 'new',
        tags:  ['semua','goreng','baru'],
      },
      {
        nama:  'Bruschetta',
        harga: 32000,
        desc:  'Roti panggang topping tomat segar, basil, dan minyak zaitun.',
        img:   'https://lh3.googleusercontent.com/aida-public/AB6AXuD97FzkmaA4pK_vi2jNWr0OoSW_XCHj5vWC_Oyc_HpoJraDGJzoY9F-4E5dtmLh1MQC5vbtqf635ga9jnrhDl6NsF0bB6fgr02cWamVGlJislHEIXZ18qG3J-xGpv3KjgCFh6Ge1xYK-PK5_euZZc4xhmLMRytZ_U_b9NFCoCXxSQ9CjUDn0Ucfxncd-JHnRPg6T9f19Z78jUEJralh_0oVqbizcDrIrsZIUOZ_F72a3FFZ7GUaiiFCvk1tSPoX1TFacvp_OBiGWDA',
        badge: null,
        tags:  ['semua','panggang'],
      },
      {
        nama:  'Onion Rings',
        harga: 27000,
        desc:  'Bawang bombay goreng crispy dengan saus ranch creamy.',
        img:   'https://lh3.googleusercontent.com/aida-public/AB6AXuDzZ43zd4lreg9T3vmd01wD4wHiwa4R0seqqk8Bcv26s9MNGiP_LF6M6EsGgk0QlXfkAMN1g5EhlcTV75PgKlAd4Ot9AYalyneqmA82MgkYyJfNFIG-mjdIC6yFaem6bR_uJLsvXAL6dIfd0vMovWCkc4UeAUr4Xs2sPyct-ZUk55QwMaiAWpa3OW41dm3et049KYMbxvV67Oiz3N-GwcVj-gfkBAymvBuHe5RBE0rernsrZb5-S4vt0YCRHiqsgiAiYomsccrspgA',
        badge: 'promo',
        tags:  ['semua','goreng','promo'],
      },
      {
        nama:  'Mini Croissant',
        harga: 22000,
        desc:  'Croissant mini berlapis mentega Prancis, renyah di luar lembut di dalam.',
        img:   'https://lh3.googleusercontent.com/aida-public/AB6AXuD97FzkmaA4pK_vi2jNWr0OoSW_XCHj5vWC_Oyc_HpoJraDGJzoY9F-4E5dtmLh1MQC5vbtqf635ga9jnrhDl6NsF0bB6fgr02cWamVGlJislHEIXZ18qG3J-xGpv3KjgCFh6Ge1xYK-PK5_euZZc4xhmLMRytZ_U_b9NFCoCXxSQ9CjUDn0Ucfxncd-JHnRPg6T9f19Z78jUEJralh_0oVqbizcDrIrsZIUOZ_F72a3FFZ7GUaiiFCvk1tSPoX1TFacvp_OBiGWDA',
        badge: 'new',
        tags:  ['semua','panggang','baru'],
      },
      {
        nama:  'Potato Wedges',
        harga: 25000,
        desc:  'Irisan kentang panggang berbumbu dengan saus keju.',
        img:   'https://lh3.googleusercontent.com/aida-public/AB6AXuDN8XPN0gGtt029uyFNZQpBtgXei-ZyDeCb6Hp_WV_38hmr-CoiZPlJoOM-CBaSm2AvqxwjVXuXygKqTCMsYC-yNZw69C8dgsCxbWgO6VOqtJWbYLgi378LeJ2Ry0-fQVei3-O_8gUB0NINEl9PESmOKf-XBntuXZW0_DU5FMfjpqjfRFpSMWatiDiMgvbUBfdcAuUboYKUwGdkrprhQEE7jGo4vEA9JbRvU0Re1rDlWoDWbMQKGMgMatwVBGKu_xpK4JfX0Yv-Vlk',
        badge: 'promo',
        tags:  ['semua','panggang','promo'],
      },
    ];

    let activeFilter = 'semua';
    let searchQuery  = '';
    let sortAsc      = true;

    function formatHarga(n) {
      return 'Rp ' + n.toLocaleString('id-ID');
    }

    function renderGrid() {
      const grid  = document.getElementById('snacks-grid');
      const empty = document.getElementById('empty-state');
      const count = document.getElementById('result-count');

      let filtered = snacks.filter(d => {
        return d.tags.includes(activeFilter) &&
               d.nama.toLowerCase().includes(searchQuery.toLowerCase());
      });

      filtered.sort((a, b) => sortAsc ? a.harga - b.harga : b.harga - a.harga);
      count.textContent = filtered.length + ' camilan';

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'flex';
        return;
      }

      empty.style.display = 'none';

      grid.innerHTML = filtered.map((d, i) => {
        let badgeHTML = '';
        if (d.badge === 'popular') badgeHTML = `<span class="sg-badge sg-badge--popular">Popular</span>`;
        else if (d.badge === 'new') badgeHTML = `<span class="sg-badge sg-badge--new">New</span>`;
        else if (d.badge === 'promo') badgeHTML = `<span class="sg-badge sg-badge--promo">Promo</span>`;

        return `
          <article class="sg-card"
            data-nama="${d.nama}"
            data-harga="${d.harga}"
            data-img="${encodeURIComponent(d.img)}"
            style="animation: fadeInUp 0.3s ease both; animation-delay: ${i * 0.05}s"
          >
            <div class="sg-card__img-wrap">
              <img src="${d.img}" alt="${d.nama}" loading="lazy">
              ${badgeHTML}
            </div>
            <div class="sg-card__body">
              <p class="sg-card__name">${d.nama}</p>
              <p class="sg-card__desc">${d.desc}</p>
              <div class="sg-card__footer">
                <span class="sg-card__price">${formatHarga(d.harga)}</span>
                <button class="sg-card__add btn-add" aria-label="Tambah ${d.nama}">
                  <span class="material-symbols-outlined">add</span>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');

      /* Klik card → detail */
      grid.querySelectorAll('.sg-card').forEach(card => {
        card.addEventListener('click', function (e) {
          if (e.target.closest('.sg-card__add')) return;
          const nama  = this.dataset.nama;
          const harga = this.dataset.harga;
          const img   = this.dataset.img;
          window.location.href = `detail.html?nama=${encodeURIComponent(nama)}&harga=${harga}&img=${img}&desc=${encodeURIComponent('Camilan spesial UrbanDine yang dibuat dari bahan pilihan berkualitas.')}`;
        });
      });

      /* Tombol tambah */
      grid.querySelectorAll('.btn-add').forEach(btn => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const original = this.innerHTML;
          this.innerHTML = '<span class="material-symbols-outlined animate-spin" style="font-size:16px">progress_activity</span>';
          this.disabled  = true;
          setTimeout(() => {
            this.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">check_circle</span>';
            this.classList.add('btn-success');
            setTimeout(() => {
              this.innerHTML = original;
              this.classList.remove('btn-success');
              this.disabled  = false;
            }, 1500);
          }, 600);
        });
      });
    }

    /* Chips */
    document.querySelectorAll('#chip-row .chip').forEach(chip => {
      chip.addEventListener('click', function () {
        document.querySelectorAll('#chip-row .chip').forEach(c => {
          c.classList.remove('chip--active');
          c.classList.add('chip--default');
        });
        this.classList.remove('chip--default');
        this.classList.add('chip--active');
        activeFilter = this.dataset.filter;
        renderGrid();
      });
    });

    /* Search */
    const searchInput   = document.getElementById('search-input');
    const searchWrapper = document.getElementById('search-wrapper');
    searchInput.addEventListener('input', () => { searchQuery = searchInput.value; renderGrid(); });
    searchInput.addEventListener('focus', () => searchWrapper.classList.add('is-focused'));
    searchInput.addEventListener('blur',  () => searchWrapper.classList.remove('is-focused'));

    /* Sort */
    document.getElementById('sort-btn').addEventListener('click', () => {
      sortAsc = !sortAsc;
      document.getElementById('sort-btn').innerHTML = `
        <span class="material-symbols-outlined" style="font-size:16px;">swap_vert</span>
        ${sortAsc ? 'Termurah' : 'Termahal'}
      `;
      renderGrid();
    });

    /* Animasi */
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    `;
    document.head.appendChild(style);

    renderGrid();
  </script>

</body>
</html>
